<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Calculadora de IMC</h1>
    <p class="subtitulo">O cálculo é feito no backend via API.</p>

    <form id="form-imc">
      <label for="peso">Peso (kg)</label>
      <input type="number" id="peso" name="peso" step="0.1" min="1" placeholder="Ex: 70" required>

      <label for="altura">Altura (m)</label>
      <input type="number" id="altura" name="altura" step="0.01" min="0.1" placeholder="Ex: 1.75" required>

      <button type="submit">Calcular IMC</button>
    </form>

    <div id="resultado" class="resultado escondido">
      <p>Seu IMC é <strong id="valor-imc"></strong></p>
      <p>Classificação: <span id="classificacao" class="badge"></span></p>
    </div>

    <p id="erro" class="erro escondido"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
